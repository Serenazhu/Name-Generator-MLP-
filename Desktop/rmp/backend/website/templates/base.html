<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Grade My Elco Professors{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

{% block navbar %}
<nav class="navbar navbar-dark bg-transparent position-absolute top-0 start-0 w-100">
  <div class="container-fluid px-3">
    <a class="navbar-brand" href="/">Grade My Elco Professors</a>
  </div>
</nav>

{% endblock %}

<body class="bg-light {% block body_class %}{% endblock %}">

  <main class="container py-4 py-5">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
